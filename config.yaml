detector:
  type: "yolo"
  model_path: "models/YOLOv10x_gestures.pt"
  confidence_threshold: 0.3
  iou_threshold: 0.45
  device: "cuda"
  input_size: [640, 640]

tracker:
  type: "sort"
  max_disappeared: 30
  min_hits: 3
  max_age: 60
  iou_threshold: 0.3

classifier:
  type: "gesture"
  model_path: "models/gesture_classifier.onnx"
  input_size: [224, 224]
  confidence_threshold: 0.7
  device: "cpu"

main_controller:
  fps: 30
  buffer_size: 1
  gesture_history_size: 5
  smoothing_window_size: 3
  gesture_duration_threshold: 0.5

gesture_controller:
  gesture_timeout: 1.0
  sequence_time_window: 1.5
  max_consecutive_gestures: 10

presentation:
  auto_save: true
  save_interval: 60
  transition_duration: 0.5
  zoom_step: 0.1
  max_zoom: 3.0
  min_zoom: 0.5

annotation:
  line_width: 3
  point_radius: 5
  font_size: 16
  font_family: "Arial"
  default_color: [0, 255, 0]
  colors:
    - [255, 0, 0]
    - [0, 255, 0]
    - [0, 0, 255]
    - [255, 255, 0]
    - [255, 0, 255]
    - [0, 255, 255]
    - [128, 0, 128]
    - [255, 165, 0]

interaction:
  max_events: 1000
  save_interval: 30
  export_format: "csv"
  enable_statistics: true

drawer:
  show_fps: true
  show_tracking_id: true
  show_confidence: true
  show_gesture_name: true
  show_trajectory: true
  trajectory_length: 20
  trajectory_color: [0, 255, 255]
  bbox_thickness: 2
  text_thickness: 1

system:
  log_level: "INFO"
  log_file: "logs/system.log"
  save_results: true
  results_dir: "results"
  camera_id: 0
  camera_width: 1280
  camera_height: 720
  auto_restart: true
  restart_interval: 3600

performance:
  enable_gpu: true
  gpu_memory_fraction: 0.7
  num_threads: 4
  enable_tensorrt: false
  precision: "fp32"

debug:
  save_frames: false
  frames_dir: "debug/frames"
  save_detections: false
  detections_dir: "debug/detections"
  save_tracks: false
  tracks_dir: "debug/tracks"
  save_gestures: false
  gestures_dir: "debug/gestures"
  visual_debug: true